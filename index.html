<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="像素荒村">
<meta name="theme-color" content="#8AD8FF">
<meta name="format-detection" content="telephone=no">
<title>像素荒村</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#8AD8FF;
  --panel:#FFFBF0;
  --cream:#FFEFC2;
  --ink:#3A2A12;
  --ink2:#7A6A50;
  --line:#2A220F;
  --gold:#FFC81A;
  --green:#5AC83A;
  --red:#E8302A;
  --orange:#C4562A;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100svh;
  background:var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px);
  background-size:16px 16px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  color:var(--ink);
  display:flex;justify-content:center;align-items:flex-start;
  touch-action:manipulation;
  overscroll-behavior:none;
}

/* ---------- 外壳：手机上满屏不滚动 ---------- */
#app{
  width:100%;max-width:100%;
  height:100vh;height:100svh;
  background:var(--panel);
  display:flex;flex-direction:column;
  overflow:hidden;
  padding-top:var(--safe-t);
}
@media (min-width:641px){
  body{padding:20px;align-items:center}
  #app{
    width:min(100%, 1180px);
    height:min(920px, calc(100vh - 40px));
    max-height:calc(100vh - 40px);
    border:4px solid var(--line);
    box-shadow:8px 8px 0 var(--line);
    padding-top:0;
  }
}

/* ---------- 顶栏 ---------- */
#topbar{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 13px;background:var(--line);color:var(--gold);
  font-weight:bold;font-size:14px;letter-spacing:1px;
}
#save-btn{
  padding:5px 13px;font-size:14px;letter-spacing:0;
  background:transparent;color:var(--gold);
  border:2px solid var(--gold);box-shadow:none;min-height:32px;
}
#save-btn:active:not(:disabled){background:var(--gold);color:var(--line)}

/* ---------- 时间条 ---------- */
#times{
  flex:0 0 auto;
  display:flex;gap:5px;
  padding:7px 12px 9px;background:var(--line);
}
#times button{
  flex:1 1 0;min-width:0;
  padding:6px 0;font-size:14px;
  background:#FFFBF0;color:var(--ink);
  border:2px solid var(--line);
  box-shadow:2px 2px 0 rgba(0,0,0,.5);
  min-height:34px;
}
#times button.on{background:var(--gold)}
#times button:disabled{opacity:.45}

/* ---------- 状态栏 ---------- */
.stats{
  flex:0 0 auto;
  display:grid;grid-template-columns:repeat(2,1fr);gap:5px;
  padding:8px;background:var(--cream);
  border-bottom:4px solid var(--line);
}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{
  border:3px solid var(--line);background:#fff;
  padding:3px 7px;font-size:14px;font-weight:bold;
  display:flex;align-items:center;gap:5px;min-height:30px;
  min-width:0;
}
.stat .k{color:#A09070;font-size:13px;flex:0 0 auto}
.stat .v{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 日志 ---------- */
#log{
  flex:1 1 auto;min-height:80px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:13px 14px;
  background:var(--panel);
  border-bottom:4px solid var(--line);
  font-size:14px;line-height:1.9;
  background-image:repeating-linear-gradient(
    0deg,transparent,transparent 3px,rgba(0,0,0,.02) 3px,rgba(0,0,0,.02) 4px
  );
  overscroll-behavior:contain;
}
#log::-webkit-scrollbar{width:8px}
#log::-webkit-scrollbar-track{background:#F2EAD8}
#log::-webkit-scrollbar-thumb{background:#C9BFA8;border:2px solid #F2EAD8}
#log{flex:1 1 auto;min-height:140px;height:260px;max-height:75%;resize:none}
@media (min-width:641px){#log{height:340px;min-height:180px}}
.line{animation:fadein .22s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.l-title{color:var(--ink);font-weight:bold;letter-spacing:1px}
.l-amb{color:#95876C}
.l-food{color:var(--orange)}
.l-wood{color:#3F7A1F}
.l-ore{color:#2F5EA8}
.l-gain{
  background:var(--gold);border:2px solid var(--line);
  padding:5px 9px;margin:7px 0;font-weight:bold;color:var(--ink);
  box-shadow:3px 3px 0 var(--line);
}
.l-win{color:#2F7A1F;font-weight:bold}

/* ---------- 村庄 ---------- */
#village{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px;background:var(--cream);
  border-bottom:4px solid var(--line);
  overscroll-behavior:contain;
}
.vhead{
  font-size:13px;font-weight:bold;color:#8A7A60;
  margin-bottom:6px;letter-spacing:1px;
}
.vhead span{color:#B06A00}
.vslots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media (min-width:560px){.vslots{grid-template-columns:repeat(4,1fr)}}
.slot{
  border:3px solid var(--line);background:#fff;
  padding:6px;min-height:82px;
  display:flex;flex-direction:column;gap:3px;
  font-size:14px;min-width:0;
}
.slot.built{background:#E4F5D6}
.slot .n{font-weight:bold;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .d{color:#8A7A60;font-size:13px;flex:1;line-height:1.45}
.slot .cost{font-size:13px;color:#B06A00;font-weight:bold}
.slot button{
  padding:4px;font-size:14px;margin-top:2px;
  min-height:30px;
}
.combo-status{margin-top:7px;padding:6px 8px;border:2px dashed #B9A77D;background:#FFF9E8;font-size:13px;line-height:1.6;color:#7A6A50}
.combo-status strong{color:#8A5B12}
.combo-status .active{color:#39752B;font-weight:bold}
.combo-status .waiting{color:#9A8A70}

/* ---------- 页面切换与内容区 ---------- */
#page-tabs{flex:0 0 auto;display:flex;gap:8px;padding:8px 12px;background:var(--cream);border-bottom:3px solid var(--line)}
#page-tabs button{flex:1;min-height:40px;padding:7px 12px;font-size:14px;background:#fff}
#page-tabs button.active{background:var(--gold)}
.page-panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.page-panel.hidden{display:none}
#explore-page{background:var(--panel)}
#village-page{overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--cream)}
#village{flex:1 1 auto;max-height:none;overflow:visible;border:0}
#log-resize-handle{flex:0 0 16px;display:flex;align-items:center;justify-content:center;background:var(--cream);border-top:2px solid var(--line);cursor:ns-resize;touch-action:none;user-select:none}
#log-resize-handle::after{content:"";width:54px;height:4px;border-radius:4px;background:#9A8A70;box-shadow:0 5px 0 #C7B998}
#log-resize-handle:focus-visible{outline:3px solid #2F5EA8;outline-offset:-3px}
.village-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 0}
.village-toolbar .hint{font-size:12px;color:#8A7A60}
#resident-open-btn{font-size:13px;min-height:36px;padding:6px 11px;background:#fff}
@media (min-width:641px){
  #page-tabs{padding:10px 16px}
  #page-tabs button{max-width:220px}
  #village{padding:12px 16px}
  .vslots{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .slot{min-height:130px;padding:10px;gap:6px}
  .slot .d,.slot .cost{font-size:13px}
  .slot button{font-size:13px;min-height:38px}
  .combo-status{font-size:13px;padding:10px 12px}
}
@media (max-width:640px){
  #app{max-width:100%}
  #log{min-height:110px;height:36svh}
  #village-page{min-height:0}
}

/* ---------- 底栏 ---------- */
#bar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:9px;
  padding:9px 13px;
  padding-bottom:calc(9px + var(--safe-b));
  background:var(--cream);
}
#clock{
  font-size:24px;font-weight:bold;letter-spacing:1px;
  font-variant-numeric:tabular-nums;flex:0 0 auto;
}
#phase-label{
  flex:1 1 auto;min-width:0;
  font-size:13px;color:#A09070;letter-spacing:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#btn{
  flex:0 0 auto;margin-left:auto;
  font-size:14px;padding:12px 16px;min-height:46px;
  background:var(--green);
}
@media (max-width:359px){
  #phase-label{display:none}
  #btn{font-size:14px;padding:9px 13px}
}

/* ---------- 通用按钮 ---------- */
button{
  font-family:inherit;font-weight:bold;color:var(--ink);
  border:3px solid var(--line);
  box-shadow:3px 3px 0 var(--line);
  cursor:pointer;background:#fff;
  transition:none;user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
button:active:not(:disabled){
  transform:translate(3px,3px);
  box-shadow:0 0 0 var(--line);
}
button:disabled{opacity:.45;cursor:not-allowed}

/* 矮屏压缩 */
@media (max-height:620px){
  #topbar{padding:6px 12px;font-size:14px}
  #times{padding:5px 8px 7px}
  #times button{min-height:30px;font-size:14px}
  .stats{padding:6px;gap:4px}
  .stat{min-height:26px;padding:2px 6px}
  #log{font-size:14px;line-height:1.75;padding:8px 13px}
  .slot{min-height:72px}
  #bar{padding:7px 12px;padding-bottom:calc(7px + var(--safe-b))}
  #clock{font-size:21px}
  #btn{min-height:42px;padding:8px 14px}
}

/* ---------- 居民档案与建筑卡片 ---------- */
.resident-panel{margin-top:8px;padding:8px;background:#FFF9E8;border:2px solid #D7C9A8}
.resident-head{font-size:13px;font-weight:bold;color:#8A6B35;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.resident-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.resident-card{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid #D7C9A8;padding:10px;min-width:0;line-height:1.5;border-radius:4px}
.resident-avatar{width:42px;height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:center;background:#EEF3E5;border:2px solid #D7C9A8;border-radius:10px;font-size:23px}
.resident-info{min-width:0;flex:1}
.resident-card .resident-name{font-size:15px;font-weight:bold;color:#5C481F}
.resident-card .resident-role{font-size:13px;color:#A06B25;margin:2px 0}
.resident-card .resident-bio{font-size:13px;color:#7A6A50;line-height:1.6;margin-top:3px}
.resident-status{display:inline-flex;margin-top:5px;padding:2px 7px;background:#EDF5E9;border:1px solid #C8D9BC;color:#55734A;font-size:12px;border-radius:3px}
.resident-story-state{font-size:12px;color:#8B806A;margin-top:5px}
.resident-empty{font-size:13px;color:#A09070;line-height:1.7;padding:4px 0;grid-column:1/-1}
.resident-count{color:#B06A00}
#resident-modal .modal-box{max-width:760px}
#resident-modal .resident-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.slot{align-content:start}
.slot .building-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.slot .building-tag{display:inline-block;padding:2px 6px;background:#F1F3E8;border:1px solid #D7C9A8;color:#6D7656;font-size:11px;line-height:1.5}
.slot .building-detail{font-size:12px;color:#786B53;line-height:1.55}
.slot .building-status{font-size:12px;font-weight:bold;color:#6B8054}
.slot .building-upgrade{font-size:11px;color:#9A896D;line-height:1.5}
.slot.built{border-color:#A9BE91;background:#F5F8EF}
@media(max-width:640px){
  #resident-modal .modal-box{max-width:100%}
  #resident-modal .resident-grid{grid-template-columns:1fr}
  .resident-card{padding:10px;gap:9px}
  .resident-avatar{width:40px;height:40px;flex-basis:40px}
  .slot .building-detail,.slot .building-upgrade{font-size:12px}
}
@media(max-width:380px){
  .resident-card .resident-name{font-size:14px}
  .resident-card .resident-role,.resident-card .resident-bio{font-size:12px}
  .resident-avatar{width:36px;height:36px;flex-basis:36px;font-size:20px}
}

/* ---------- 聚落记事 ---------- */
#chronicle-list{display:flex;flex-direction:column;gap:8px}
.chronicle-entry{padding:8px 9px;background:#fff;border:2px solid #D7C9A8;line-height:1.6;font-size:14px}
.chronicle-entry .when{font-size:13px;color:#A09070;margin-bottom:3px}
.chronicle-entry .what{font-weight:bold;color:#5C481F}
.chronicle-entry .detail{color:#7A6A50;margin-top:2px}
.chronicle-empty{padding:18px 8px;text-align:center;color:#A09070;font-size:14px;line-height:1.8}

/* ---------- 弹层 ---------- */
#journal-modal{
  position:fixed;inset:0;z-index:60;
  background:rgba(20,16,8,.55);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  padding-bottom:calc(16px + var(--safe-b));
}
#journal-modal.hidden{display:none}
#resident-modal{position:fixed;inset:0;z-index:55;background:rgba(20,16,8,.55);display:flex;align-items:center;justify-content:center;padding:16px;padding-bottom:calc(16px + var(--safe-b))}
#resident-modal.hidden{display:none}
#modal{
  position:fixed;inset:0;z-index:50;
  background:rgba(20,16,8,.55);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  padding-bottom:calc(16px + var(--safe-b));
}
#modal.hidden{display:none}
.modal-box{
  width:100%;max-width:420px;max-height:82svh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--panel);
  border:4px solid var(--line);
  box-shadow:6px 6px 0 var(--line);
  padding:14px;
}
.modal-title{
  font-weight:bold;font-size:15px;letter-spacing:1px;
  padding-bottom:8px;margin-bottom:8px;
  border-bottom:3px solid var(--line);
}
.modal-tip{
  font-size:14px;line-height:1.7;color:#7A6A50;margin-bottom:12px;
}
#code{
  width:100%;height:78px;
  font-family:inherit;font-size:16px;  /* 16px：防 iOS 自动放大 */
  line-height:1.5;
  padding:8px;margin:8px 0;
  color:var(--ink);background:#fff;
  border:3px solid var(--line);
  resize:none;outline:none;
  -webkit-appearance:none;
}
.modal-box .wide{
  display:block;width:100%;
  padding:13px;font-size:14px;min-height:46px;
  margin-bottom:8px;
}
.modal-box .wide.ghost{background:#fff;color:#7A6A50}
#modal-msg{
  font-size:14px;font-weight:bold;color:#B06A00;
  min-height:18px;text-align:center;
}
.relationship-section{margin-top:14px;padding-top:10px;border-top:3px dashed #D7C9A8}
.relationship-grid{display:grid;grid-template-columns:1fr;gap:7px}
.relationship-card{padding:8px;background:#FFF9E8;border:2px solid #D7C9A8;font-size:13px;line-height:1.65}
.relationship-card strong{color:#5C481F}
.relationship-card .relation-meter{color:#8A6B35;font-size:12px}
.relationship-card .relation-note{color:#7A6A50;margin-top:2px}
.resident-work{margin-top:10px}
.resident-work .work-item{padding:3px 0;border-top:1px dashed #D7C9A8}
.resident-work .work-item:first-of-type{border-top:0}
@media (min-width:641px){.relationship-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* V0.3.1：居民生活场景与事件选择 */
.settlement-life{margin-top:12px;padding:10px;background:#FFF8E5;border:3px solid var(--line);box-shadow:3px 3px 0 rgba(42,34,15,.18)}
.life-head{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:14px;padding-bottom:8px;border-bottom:2px dashed #D7C9A8}
.life-head span{font-size:11px;color:#8A7A60;font-weight:normal}
.life-card{margin-top:8px;padding:9px;background:#fff;border:2px solid #D7C9A8}
.life-title{font-weight:bold;font-size:13px;color:#5C481F}
.life-title small{font-weight:normal;color:#8A7A60}
.life-text{font-size:12px;line-height:1.7;margin-top:4px;color:#6F6049}
.life-people{font-size:12px;line-height:1.7;margin-top:6px;color:#4E7138;font-weight:bold}
.life-empty{font-size:12px;line-height:1.7;color:#8A7A60;padding:10px 2px}
#event-choice-modal{position:fixed;inset:0;z-index:80;background:rgba(20,16,8,.62);display:flex;align-items:center;justify-content:center;padding:16px;padding-bottom:calc(16px + var(--safe-b))}
#event-choice-modal.hidden{display:none}
.event-choice-box{max-width:460px}
.choice-hint{font-size:12px;line-height:1.6;color:#8A7A60;margin-top:4px}
.discovery-board{margin-top:12px;padding:10px;background:#F5F0D9;border:3px solid var(--line);box-shadow:3px 3px 0 rgba(42,34,15,.15)}
.discovery-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.discovery-item{display:inline-block;padding:5px 7px;background:#fff;border:1px solid #C7B88E;font-size:12px;color:#67532B}
.discovery-empty{font-size:12px;color:#8A7A60;line-height:1.6}
.discovery-arc{font-size:12px;line-height:1.7;color:#5C6F40;margin-top:8px;padding-top:7px;border-top:1px dashed #C7B88E}
#event-choice-options .wide{white-space:normal;text-align:left;line-height:1.5}

/* V0.2.1：可读性与窄屏适配 */
#topbar{font-size:15px;letter-spacing:.5px}
#times button{font-size:13px;min-height:38px}
.stat{font-size:13px;min-height:34px}
.stat .k{font-size:12px}
.stat .v{font-size:14px}
.vhead{font-size:13px}
.slot{font-size:13px;min-height:92px}
.slot .n{font-size:14px;white-space:normal;line-height:1.35}
.slot .d,.slot .cost{font-size:12px;line-height:1.55}
.slot button{font-size:12.5px;min-height:34px}
.combo-status{font-size:12px;line-height:1.7}
.resident-head{font-size:13px}
.resident-card .resident-name{font-size:14px}
.resident-card .resident-role{font-size:12px}
.resident-card .resident-bio{font-size:12px;line-height:1.6}
.resident-empty{font-size:12px}
.chronicle-entry{font-size:13px;line-height:1.75}
.chronicle-entry .when{font-size:12px}
.chronicle-empty{font-size:13px}
.modal-tip{font-size:13px;line-height:1.8}
#modal-msg{font-size:13px}
@media (max-width:420px){
  #topbar{gap:5px;padding:8px 9px;font-size:13px}
  #topbar>div{gap:5px!important}
  #topbar button{padding-left:7px!important;padding-right:7px!important}
  .resident-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .resident-card{padding:8px}
}


/* V0.4.0 阶段一：移动端与基础卡片适配（不改变游戏数值和存档结构） */
@supports (height: 100dvh) {
  #app { height:100dvh; }
}
button, .slot, .resident-card, .life-card, .chronicle-entry {
  overflow-wrap:anywhere;
}
button:focus-visible {
  outline:3px solid #2F5EA8;
  outline-offset:3px;
}
@media (max-width:640px) {
  body { display:block; }
  #app { width:100%; max-width:none; min-height:0; }
  #topbar { min-height:48px; padding-left:12px; padding-right:10px; }
  #times { gap:6px; padding:8px 9px 10px; }
  #times button { min-height:42px; font-size:14px; }
  .stats { gap:6px; padding:8px; }
  .stat { min-height:38px; padding:5px 7px; }
  #page-tabs { position:sticky; top:0; z-index:5; gap:8px; padding:8px; }
  #page-tabs button { min-height:44px; }
  #village-page { overflow-y:auto; }
  #village { padding:10px; }
  .village-toolbar { padding:10px 10px 0; align-items:flex-start; }
  #resident-open-btn { min-height:42px; }
  .vslots { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .slot { min-height:116px; padding:9px; gap:5px; }
  .slot .n { font-size:14px; }
  .slot .d { font-size:13px; line-height:1.55; }

const $ = s => document.querySelector(s);
const logBox   = $('#log');
const btn      = $('#btn');
const clockEl  = $('#clock');
const phaseEl  = $('#phase-label');
const vslots   = $('#vslots');

const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmtClock(ms){
  const m = String(Math.floor(ms / 60000)).padStart(2, '0');
  const s = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
  return m + ':' + s;
}
function pushLog(text, cls){
  const d = document.createElement('div');
  d.className = 'line ' + (cls || '');
  d.textContent = text;
  logBox.appendChild(d);
  while (logBox.children.length > 220) logBox.removeChild(logBox.firstChild);
  requestAnimationFrame(() => { logBox.scrollTop = logBox.scrollHeight; });
}

function addChronicle(type, title, detail){
  const entry = {
    time: new Date().toLocaleString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}),
    region: REGIONS[S.region].name,
    type: type,
    title: title,
    detail: detail || ''
  };
  S.chronicle.push(entry);
  if (S.chronicle.length > 100) S.chronicle = S.chronicle.slice(-100);
}
function relationKey(a,b){ return [a,b].sort().join('|'); }
function addResident(id){
  const resident = RESIDENTS.find(r => r.id === id);
  if (!resident || S.residents.includes(id)) return false;
  const previous = S.residents.slice();
  S.residents.push(id);
  S.residentJoinAt[id] = S.totalExplorations;
  previous.forEach(otherId => {
    const key = relationKey(id, otherId);
    if (!S.relationships[key]) S.relationships[key] = {familiarity:0, trust:0};
  });
  const detail = resident.name + '加入了聚落。' + resident.background;
  pushLog('✦ 新居民加入：' + resident.name + '。' + resident.role + '，' + resident.personality + '。', 'l-gain');
  addChronicle('resident', resident.name + '加入了聚落', detail);
  triggerRegionalResidentDialogueForResident(id);
  return true;
}
function residentRequirementMet(resident){
  const req = resident.unlock;
  if (!req) return false;
  if (Number.isFinite(req.focusMinutes)) return S.totalFocusMs >= req.focusMinutes * 60000;
  if (S.region < req.region) return false;
  return (S.exploredRegions[req.region] || 0) >= req.explored && !!(S.builtRegions[req.region] && S.builtRegions[req.region][req.built]);
}
function checkResidentUnlocks(){
  let changed = false;
  RESIDENTS.forEach(resident => {
    if (residentRequirementMet(resident) && addResident(resident.id)) changed = true;
  });
  return changed;
}
function relationLabel(rel){
  if (rel.familiarity >= 20 && rel.trust >= 14) return '亲近';
  if (rel.familiarity >= 8 && rel.trust >= 8) return '信任';
  if (rel.familiarity >= 8) return '熟悉';
  return '初识';
}
function updateRelationships(reason){
  const ids = S.residents.slice();
  for (let i=0;i<ids.length;i++) for (let j=i+1;j<ids.length;j++) {
    const key = relationKey(ids[i],ids[j]);
    const rel = S.relationships[key] || (S.relationships[key]={familiarity:0,trust:0});
    const before = relationLabel(rel);
    rel.familiarity = Math.min(20, rel.familiarity + (reason === 'build' ? 1 : 2));
    rel.trust = Math.min(14, rel.trust + (reason === 'build' ? 2 : 1));
    const after = relationLabel(rel);
    if (after !== before) {
      const a = RESIDENTS.find(r=>r.id===ids[i]);
      const b = RESIDENTS.find(r=>r.id===ids[j]);
      const keyEvent = key + ':' + after;
      if (!S.relationshipEvents.includes(keyEvent)) {
        S.relationshipEvents.push(keyEvent);
        const line = after === '熟悉' ? a.name+'和'+b.name+'渐渐熟悉起来，已经能自然地接过对方手里的活。' : after === '信任' ? a.name+'和'+b.name+'开始放心地把重要的事情交给彼此。' : a.name+'和'+b.name+'之间有了不必多说也能明白的默契。';
        pushLog('✦ '+line,'l-gain');
        addChronicle('relationship', a.name+'与'+b.name+'的关系变化：'+after, line);
      }
    }
  }
}
function triggerPairEvent(reason){
  const residents = S.residents.slice();
  if (residents.length < 2) return false;
  const types = reason === 'explore' ? ['explore','help'] : reason === 'build' ? ['help','disagree'] : ['night'];
  const candidates=[];
  for(let i=0;i<residents.length;i++) for(let j=i+1;j<residents.length;j++) {
    const ids=[residents[i],residents[j]].sort();
    const pairKey=ids.join('|');
    const data=PAIR_STORIES[pairKey] || {};
    const first=RESIDENTS.find(r=>r.id===ids[0]), second=RESIDENTS.find(r=>r.id===ids[1]);
    const fallback={
      explore:first.name+'熟悉'+first.role+'相关的工作，'+second.name+'则凭借'+second.personality+'留意到另一处细节。她们把各自发现拼在一起，找到了一条更妥当的路线。',
      night:first.name+'和'+second.name+'在夜里聊起各自以前的生活。起初只是断断续续的几句话，后来她们发现，对方也有一些从未对别人提起的习惯。',
      help:first.name+'看见'+second.name+'正在处理'+second.role+'的工作，便主动搭了把手。两人顺势调整了工具和分工，之后再做起来省力不少。',
      disagree:first.name+'和'+second.name+'对一件小事有不同看法。她们没有马上说服对方，而是把理由一条条讲清楚，最后找到了都能接受的办法。'
    };
    for(const type of types) if((data[type] || fallback[type]) && !S.socialEvents.includes(pairKey+':'+type)) candidates.push({pairKey,type,ids,text:data[type] || fallback[type]});
  }
  if(!candidates.length) return false;
  const item=pick(candidates);
  S.socialEvents.push(item.pairKey+':'+item.type);
  const a=RESIDENTS.find(r=>r.id===item.ids[0]);
  const b=RESIDENTS.find(r=>r.id===item.ids[1]);
  const title=item.type==='explore'?'一起探索':item.type==='night'?'夜间聊天':item.type==='help'?'互相帮助':'一次小小的分歧';
  const key=relationKey(a.id,b.id);
  const rel=S.relationships[key] || (S.relationships[key]={familiarity:0,trust:0});
  rel.familiarity=Math.min(20,rel.familiarity+2);
  rel.trust=Math.min(14,rel.trust+(item.type==='disagree'?1:2));
  pushLog('✦ '+a.name+'与'+b.name+' · '+title+'：'+item.text,'l-gain');
  addChronicle('social',a.name+'与'+b.name+'：'+title,item.text);
  return true;
}

function showChoiceModal(){
  const modal=$('#event-choice-modal'); if(!modal || !script || !script.event) return;
  const event=script.event;
  $('#event-choice-title').textContent=event.title;
  $('#event-choice-text').textContent=event.text;
  const choices=$('#event-choice-options'); choices.innerHTML='';
  event.choices.forEach((choice,index)=>{
    const button=document.createElement('button'); button.className='wide'; button.textContent=choice.label;
    button.addEventListener('click',()=>resolveExplorationChoice(index)); choices.appendChild(button);
  });
  modal.classList.remove('hidden');
}
function resolveExplorationChoice(index){
  if(S.phase!=='choice' || !script || !script.event || !script.event.choices[index]) return;
  const event=script.event, choice=event.choices[index];
  Object.entries(choice.effects||{}).forEach(([key,value])=>{ if(Object.prototype.hasOwnProperty.call(S.mat,key)) S.mat[key]=Math.max(0,S.mat[key]+value); });
  if(!S.regionDiscoveries.includes(event.id)) S.regionDiscoveries.push(event.id);
  S.regionArc=Math.max(S.regionArc,Number(choice.clue)||0);
  event.choiceResolved=true;
  event.choiceResult=choice.result;
  event.choiceLabel=choice.label;
  event.choiceEffects=choice.effects||{};
  event.choiceItem=choice.item||null;
  S.pendingChoice=null;
  $('#event-choice-modal').classList.add('hidden');
  S.phase='focus';
  onFocusEnd();
}

function triggerRegionalResidentDialogue(){
  let triggered=false;
  S.residents.slice().forEach(id=>{ if(triggerRegionalResidentDialogueForResident(id)) triggered=true; });
  return triggered;
}

function triggerResidentStories(){
  RESIDENTS.forEach(r => {
    if (!S.residents.includes(r.id) || !r.story) return;
    const joinedAt = Number.isFinite(S.residentJoinAt[r.id]) ? S.residentJoinAt[r.id] : S.totalExplorations;
    const flag = r.id + ':main';
    if (S.totalExplorations - joinedAt >= r.story.afterExplorations && !S.residentStories.includes(flag)) {
      S.residentStories.push(flag);
      pushLog('✦ '+r.name+'想起了一段往事。'+r.story.text,'l-gain');
      addChronicle('story',r.story.title,r.story.text);
    }
  });
}

function residentContributions(){
  const active=[];
  S.residents.forEach(id=>{
    const r=RESIDENTS.find(x=>x.id===id); if(!r || !r.contribution) return;
    const c=r.contribution;
    const regionBuilt=S.builtRegions[S.region] || [];
    const ready=c.anyBuilt ? regionBuilt.some(Boolean) : (c.region===S.region && !!regionBuilt[c.building]);
    if(ready) active.push({name:r.name,resource:c.resource,amount:c.amount,desc:c.desc});
  });
  return active;
}
function getResidentCurrentStatus(resident){
  const c = resident.contribution;
  if (c) {
    const regionBuilt = S.builtRegions[S.region] || [];
    const ready = c.anyBuilt ? regionBuilt.some(Boolean) : (c.region === S.region && !!regionBuilt[c.building]);
    if (ready) {
      const resourceName = c.resource === 'food' ? '食材' : c.resource === 'wood' ? '木料' : '矿料';
      return '正在协助整理' + resourceName;
    }
  }
  return '在聚落休息';
}

function snapshot(){
  return {
    v: 8,
    region: S.region,
    mat: { food: S.mat.food, wood: S.mat.wood, ore: S.mat.ore },
    built: S.built.slice(),
    focusMs: S.focusMs,
    finished: S.finished,
    chronicle: S.chronicle.slice(-100),
    residents: S.residents.slice(),
    exploredRegions: S.exploredRegions.slice(),
    builtRegions: S.builtRegions.map(row => row.slice()),
    totalFocusMs: S.totalFocusMs,
    totalExplorations: S.totalExplorations,
    residentJoinAt: {...S.residentJoinAt},
    residentStories: S.residentStories.slice(),
    relationships: JSON.parse(JSON.stringify(S.relationships)),
    relationshipEvents: S.relationshipEvents.slice(),
    socialEvents: S.socialEvents.slice(),
    regionDiscoveries: S.regionDiscoveries.slice(),
    hiddenItems: S.hiddenItems.slice(),
    regionArc: S.regionArc,
    pendingChoice: S.pendingChoice ? {...S.pendingChoice} : null,
    // v3：保存当前计时阶段和探索进度，刷新页面后可接着进行
    phase: ['focus','rest','choice'].includes(S.phase) ? S.phase : 'idle',
    endAt: (S.phase === 'focus' || S.phase === 'rest') ? endAt : 0,
    script: (S.phase === 'focus' || S.phase === 'choice') && script ? script : null,
    lineIdx: (S.phase === 'focus' || S.phase === 'choice') ? lineIdx : 0,
  };
}
function applySnapshot(d){
  // 先完整检查结构，再修改游戏状态，避免坏存档造成半载入。
  if (!d || typeof d !== 'object' || Array.isArray(d)) return false;
  if (!Number.isInteger(d.region) || d.region < 0 || d.region >= REGIONS.length) return false;
  if (!d.mat || typeof d.mat !== 'object' || Array.isArray(d.mat)) return false;
  if (!Array.isArray(d.built) || d.built.length < 4) return false;
  const resourceKeys = ['food', 'wood', 'ore'];
  for (const key of resourceKeys) {
    const value = Number(d.mat[key]);
    if (!Number.isFinite(value) || value < 0) return false;
  }
  S.region = d.region;
  S.mat = {
    food: Math.min(99999999, Math.floor(Number(d.mat.food))),
    wood: Math.min(99999999, Math.floor(Number(d.mat.wood))),
    ore: Math.min(99999999, Math.floor(Number(d.mat.ore))),
  };
  S.built = [0, 1, 2, 3].map(i => !!d.built[i]);
  if (typeof d.focusMs === 'number' && d.focusMs >= 60000) {
    S.focusMs = Math.min(60 * 60 * 1000, d.focusMs);
  }
  S.finished = !!d.finished;
  S.chronicle = Array.isArray(d.chronicle) ? d.chronicle.filter(x => x && typeof x.title === 'string').slice(-100) : [];
  // 新版直接读取探索计数；旧版则从记事本恢复，避免升级后丢失真实探索记录。
  if (Array.isArray(d.exploredRegions) && d.exploredRegions.length >= REGIONS.length) {
    S.exploredRegions = REGIONS.map((_, i) => Math.max(0, Math.floor(Number(d.exploredRegions[i]) || 0)));
  } else {
    S.exploredRegions = REGIONS.map((_, i) => S.chronicle.filter(e => e.type === 'explore' && e.region === REGIONS[i].name).length);
  }
  if (Array.isArray(d.builtRegions) && d.builtRegions.length >= REGIONS.length) {
    S.builtRegions = REGIONS.map((_, i) => [0,1,2,3].map(j => !!(d.builtRegions[i] && d.builtRegions[i][j])));
  } else {
    // 旧版没有历史建筑表：从聚落记事恢复已建建筑；当前区域再以存档 built 字段补齐。
    S.builtRegions = REGIONS.map((region, ri) => region.buildings.map(b => S.chronicle.some(e => e.type === 'build' && e.region === region.name && e.title === '建成了' + b.name)));
    S.builtRegions[d.region] = [0,1,2,3].map(i => !!d.built[i]);
  }
  S.totalFocusMs = Number.isFinite(Number(d.totalFocusMs)) && Number(d.totalFocusMs) >= 0 ? Math.floor(Number(d.totalFocusMs)) : 0;
  S.totalExplorations = Number.isFinite(Number(d.totalExplorations)) && Number(d.totalExplorations) >= 0 ? Math.floor(Number(d.totalExplorations)) : S.exploredRegions.reduce((a,b)=>a+b,0);
  S.residentJoinAt = d.residentJoinAt && typeof d.residentJoinAt === 'object' && !Array.isArray(d.residentJoinAt) ? {...d.residentJoinAt} : {};
  S.residentStories = Array.isArray(d.residentStories) ? d.residentStories.filter(x=>typeof x==='string').slice(-100) : [];
  S.relationships = d.relationships && typeof d.relationships==='object' && !Array.isArray(d.relationships) ? d.relationships : {};
  S.relationshipEvents = Array.isArray(d.relationshipEvents) ? d.relationshipEvents.filter(x=>typeof x==='string').slice(-100) : [];
  S.socialEvents = Array.isArray(d.socialEvents) ? d.socialEvents.filter(x=>typeof x==='string').slice(-300) : [];
  S.regionDiscoveries = Array.isArray(d.regionDiscoveries) ? d.regionDiscoveries.filter(x=>typeof x==='string').slice(-30) : [];
  S.hiddenItems = Array.isArray(d.hiddenItems) ? d.hiddenItems.filter(x=>typeof x==='string').slice(-50) : [];
  S.regionArc = Math.max(0,Math.min(4,Math.floor(Number(d.regionArc)||0)));
  if (Number(d.v || 0) < 8 && S.region > 0 && S.regionDiscoveries.length === 0) {
    S.regionDiscoveries = REGION_STORY_EVENTS.slice(0,S.region).map(event=>event.id);
    S.regionArc = S.region;
    S.chronicle.push({time:new Date().toLocaleString('zh-CN'),region:REGIONS[S.region].name,type:'migration',title:'旧行程线索整理',detail:'升级前走过的区域已经留在旧记事里。新的探索会从当前区域继续补全地下聚落的线索。'});
    S.chronicle = S.chronicle.slice(-100);
  }
  S.pendingChoice = d.pendingChoice && typeof d.pendingChoice.eventId==='string' ? {eventId:d.pendingChoice.eventId} : null;
  const validResidentIds = RESIDENTS.map(r => r.id);
  const claimed = Array.isArray(d.residents) ? [...new Set(d.residents.filter(id => validResidentIds.includes(id)))] : [];
  // 不信任旧存档中仅凭区域编号误解锁的居民；只保留当前进度确实满足条件者。
  S.residents = claimed.filter(id => residentRequirementMet(RESIDENTS.find(r => r.id === id)));
  S.residents.forEach(id => { if (!Number.isFinite(S.residentJoinAt[id])) S.residentJoinAt[id] = S.totalExplorations; });
  // 清理无效关系键并为现有居民对补齐初始关系数据。
  const validRelations = {};
  for(let i=0;i<S.residents.length;i++) for(let j=i+1;j<S.residents.length;j++) {
    const key=relationKey(S.residents[i],S.residents[j]); const rel=S.relationships[key] || {};
    validRelations[key]={familiarity:Math.max(0,Math.min(20,Math.floor(Number(rel.familiarity)||0))),trust:Math.max(0,Math.min(14,Math.floor(Number(rel.trust)||0)))};
  }
  S.relationships=validRelations;
  // 旧版 v2 存档没有运行中的计时信息，按空闲状态载入即可。
  S.phase = (d.v >= 3 && ['focus','rest','choice'].includes(d.phase)) ? d.phase : 'idle';
  endAt = (S.phase === 'focus' || S.phase === 'rest') && Number.isFinite(d.endAt) ? d.endAt : 0;
  script = (S.phase === 'focus' || S.phase === 'choice') && d.script && Array.isArray(d.script.lines) && d.script.yield ? d.script : null;
  lineIdx = script ? Math.max(0, Math.min(script.lines.length, Number(d.lineIdx) || 0)) : 0;
  if (S.phase === 'choice' && (!script || !script.event || !Array.isArray(script.event.choices))) { S.phase='idle'; S.pendingChoice=null; }
  if (S.phase === 'focus' && !script) {
    S.phase = 'idle';
    endAt = 0;
  }
  if ((S.phase === 'focus' || S.phase === 'rest') && (!endAt || !Number.isFinite(endAt))) {
    S.phase = 'idle';
    endAt = 0;
    script = null;
    lineIdx = 0;
  }
  return true;
}
function save(){
  if (!storageOK) return false;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot())); return true; } catch (e) { return false; }
}
function load(){
  if (!storageOK) return 'unavailable';
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return 'new';
    const data = JSON.parse(raw);
    if (!applySnapshot(data)) return 'invalid';
    // 将旧版存档迁移到新版结构，并把被旧解锁 Bug 错误加入的居民从存档中纠正。
    const before = Array.isArray(data.residents) ? data.residents : [];
    if (data.v !== 8 || JSON.stringify(before) !== JSON.stringify(S.residents) || !Array.isArray(data.builtRegions) || !Array.isArray(data.exploredRegions)) save();
    return 'loaded';
  } catch (e) { return 'invalid'; }
}

/* 存档码：base64(JSON) */
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function exportCode(){
  return 'PXV1:' + b64enc(JSON.stringify(snapshot()));
}
function importCode(code){
  code = (code || '').trim();
  if (!code) throw new Error('empty');
  if (code.startsWith('PXV1:')) code = code.slice(5);
  return JSON.parse(b64dec(code));
}

function renderStats(){
  const r = REGIONS[S.region];
  $('#region-name').textContent = r.name;
  $('#v-food').textContent = S.mat.food;
  $('#v-wood').textContent = S.mat.wood;
  $('#v-ore').textContent  = S.mat.ore;
  $('#v-prog').textContent = S.built.filter(Boolean).length + '/' + r.buildings.length;
}
function syncTimes(){
  document.querySelectorAll('#times button').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.min) * 60000 === S.focusMs);
    b.disabled = S.phase === 'focus';
  });
}
function costText(c){
  const p = [];
  if (c.food) p.push('食材' + c.food);
  if (c.wood) p.push('木料' + c.wood);
  if (c.ore)  p.push('矿料' + c.ore);
  return p.join(' ');
}
function canAfford(c){
  return (!c.food || S.mat.food >= c.food)
      && (!c.wood || S.mat.wood >= c.wood)
      && (!c.ore  || S.mat.ore  >= c.ore);
}
function getActiveCombos(){
  const combos = REGIONS[S.region].combos || [];
  return combos.filter(combo => combo.requires.every(i => S.built[i]));
}
function renderComboStatus(){
  const box = $('#combo-status');
  const combos = REGIONS[S.region].combos || [];
  if (!box || !combos.length) return;
  box.innerHTML = '<strong>建筑组合</strong>' + combos.map(combo => {
    const active = combo.requires.every(i => S.built[i]);
    const names = combo.requires.map(i => REGIONS[S.region].buildings[i].name).join(' + ');
    return '<div class="' + (active ? 'active' : 'waiting') + '">' +
      (active ? '✦ 已激活：' : '◇ 待组合：') + combo.name + '（' + names + '）' +
      ' · ' + (active ? combo.effect : combo.desc) + '</div>';
  }).join('');
}

function renderVillage(){
  const r = REGIONS[S.region];
  vslots.innerHTML = '';
  r.buildings.forEach((b, i) => {
    const built = !!S.built[i];
    const el = document.createElement('div');
    el.className = 'slot building-card' + (built ? ' built' : '');

    const name = document.createElement('div'); name.className = 'n';
    name.textContent = (b.icon || '⌂') + ' ' + b.name;
    const purpose = document.createElement('div'); purpose.className = 'building-detail';
    purpose.textContent = '用途：' + b.desc;
    const output = document.createElement('div'); output.className = 'd';
    output.textContent = '产出：' + b.effect;
    const meta = document.createElement('div'); meta.className = 'building-meta';
    const level = document.createElement('span'); level.className = 'building-tag';
    level.textContent = '等级：' + (built ? 'Lv.1' : '未建成');
    const status = document.createElement('span'); status.className = 'building-tag building-status';
    status.textContent = built ? '已建成' : '待建造';
    meta.append(level,status);
    const condition = document.createElement('div'); condition.className = 'cost';
    condition.textContent = built ? '建造状态：已投入使用' : '建造条件：' + costText(b.cost);
    const upgrade = document.createElement('div'); upgrade.className = 'building-upgrade';
    upgrade.textContent = built ? '升级条件：当前版本暂未开放' : '升级条件：建成后可在后续版本查看';
    el.append(name,purpose,output,meta,condition,upgrade);

    if (!built) {
      const buildButton = document.createElement('button');
      buildButton.textContent = '建造';
      buildButton.disabled = S.phase === 'focus' || !canAfford(b.cost);
      buildButton.onclick = () => doBuild(i);
      el.appendChild(buildButton);
    }
    vslots.appendChild(el);
  });
  renderComboStatus();
}

function updateButton(){
  const done = S.built.every(Boolean);
  const last = S.region >= REGIONS.length - 1;

  if (S.phase === 'focus' || S.phase === 'choice') {
    btn.disabled = true;
    btn.textContent = '探索中…';
    return;
  }
  if (done && last) {
    btn.disabled = true;
    btn.textContent = '旅程告一段落';
    return;
  }
  if (done && !last) {
    btn.disabled = false;
    btn.textContent = '迁往下一处';
    return;
  }
  btn.disabled = false;
  btn.textContent = S.phase === 'rest' ? '继续探索' : '开始探索';
}
function renderAll(){
  renderStats();
  renderVillage();
  renderResidents();
  renderResidentWork();
  renderSettlementLife();
  renderDiscoveryBoard();
  updateButton();
  syncTimes();
}

/* ========================================================
   建造
======================================================== */
function doBuild(i){
  const b = REGIONS[S.region].buildings[i];
  if (S.built[i] || !canAfford(b.cost)) return;

  if (b.cost.food) S.mat.food -= b.cost.food;
  if (b.cost.wood) S.mat.wood -= b.cost.wood;
  if (b.cost.ore)  S.mat.ore  -= b.cost.ore;

  const activeBefore = getActiveCombos().map(combo => combo.name);
  S.built[i] = true;
  S.builtRegions[S.region][i] = true;
  pushLog('▸ ' + b.icon + ' ' + b.name + '建好了。' + b.line, 'l-title');
  addChronicle('build', '建成了' + b.name, b.line);
  updateRelationships('build');
  triggerPairEvent('build');
  checkResidentUnlocks();
  triggerBuildingDialogue(S.region, i);
  triggerResidentStories();
  if (Math.random() < 0.35) {
    const remark = residentRemark('build');
    if (remark) pushLog('「' + remark.text + '」——' + remark.name, 'l-amb');
  }
  getActiveCombos().forEach(combo => {
    if (!activeBefore.includes(combo.name)) {
      pushLog('✦ 建筑组合激活：' + combo.name + '。' + combo.effect, 'l-gain');
      addChronicle('combo', '激活建筑组合：' + combo.name, combo.desc + '；' + combo.effect);
    }
  });

  save();
  renderAll();

  if (S.built.every(Boolean)) {
    if (S.region >= REGIONS.length - 1) finishGame();
    else pushLog('▸ 这片地方已经建满。该往下走了。', 'l-gain');
  }
}
function finishGame(){
  S.finished = true;
  addChronicle('milestone', '四片荒野都亮起了灯', '你们终于把一路经过的地方，都变成了可以安心生活的营地。');
  pushLog('★ 四片荒野都亮起了灯。', 'l-win');
  pushLog('你站在灯塔上回头望——回廊的篝火、地窖的砖窑、矿道的熔炉、林间的树屋，一路亮过来。', 'l-amb');
  pushLog('厨师蹲在塔沿上啃一颗地底果子，说：「差不多该想想晚饭了。」', 'l-amb');
  save();
  updateButton();
}
function nextRegion(){
  S.region = Math.min(S.region + 1, REGIONS.length - 1);
  S.built = [false, false, false, false];
  addChronicle('travel', '迁往' + REGIONS[S.region].name, REGIONS[S.region].intro);

}

/* ========================================================
   探索脚本
======================================================== */
function computeYield(){
  const y = {
    food: 2 + Math.floor(Math.random() * 2),
    wood: 2 + Math.floor(Math.random() * 2),
    ore:  1 + Math.floor(Math.random() * 2),
  };
  REGIONS[S.region].buildings.forEach((b, i) => {
    if (S.built[i] && b.bonus) {
      for (const k in b.bonus) y[k] = (y[k] || 0) + b.bonus[k];
    }
  });
  // 建筑组合奖励由已建成的建筑自动判定，每轮只计算一次。
  getActiveCombos().forEach(combo => {
    for (const k in combo.bonus) y[k] = (y[k] || 0) + combo.bonus[k];
  });
  residentContributions().forEach(c => { y[c.resource] = (y[c.resource] || 0) + c.amount; });
  return y;
}
function buildScript(){
  const r  = REGIONS[S.region];
  const amb = shuffle(r.ambient.slice());
  const fl  = shuffle(r.foodLines.slice());
  const wl  = shuffle(r.woodLines.slice());
  const ol  = shuffle(r.oreLines.slice());
  const y   = computeYield();
  // 尚未发现的区域主线事件优先出现；普通资源遭遇仍保留原概率。
  const storyEvent = REGION_STORY_EVENTS[S.region];
  let event = storyEvent && !S.regionDiscoveries.includes(storyEvent.id) ? JSON.parse(JSON.stringify(storyEvent)) : null;
  if (!event) {
    const common = Math.random() < 0.42 ? pick(REGION_EVENTS[S.region]) : null;
    event = common ? {...common, id:'common:'+S.region+':'+common.title} : null;
    if (event && event.effects) for (const k in event.effects) y[k] = Math.max(0, (y[k] || 0) + event.effects[k]);
  }

  const lines = [];
  lines.push({ t: '── ' + r.name + ' ──', c: 'l-title' });
  lines.push({ t: amb[0], c: 'l-amb' });
  lines.push({ t: amb[1] || amb[0], c: 'l-amb' });

  const nF = Math.min(fl.length, Math.max(1, Math.round(y.food / 2)));
  for (let i = 0; i < nF; i++) lines.push({ t: fl[i], c: 'l-food' });

  const nW = Math.min(wl.length, Math.max(1, Math.round(y.wood / 2)));
  for (let i = 0; i < nW; i++) lines.push({ t: wl[i], c: 'l-wood' });

  const nO = Math.min(ol.length, Math.max(1, Math.round(y.ore / 1.5)));
  for (let i = 0; i < nO; i++) lines.push({ t: ol[i], c: 'l-ore' });

  const target = Math.max(8, Math.min(60, Math.floor(S.focusMs / 1000 / 12)));
  let ai = 2;
  while (lines.length < target - 1) {
    const pos = 2 + Math.floor(Math.random() * Math.max(1, lines.length - 2));
    lines.splice(pos, 0, { t: amb[ai % amb.length], c: 'l-amb' });
    ai++;
  }

  if (Math.random() < 0.28) {
    const remark = residentRemark('explore');
    if (remark) lines.push({ t: '「' + remark.text + '」——' + remark.name, c: 'l-amb' });
  }

  if (event) {
    lines.push({ t: '✧ 遭遇事件 · ' + event.title, c: 'l-title' });
    lines.push({ t: event.text, c: 'l-amb' });
    if (event.choices) lines.push({ t: '· 这件事需要你做出选择。', c: 'l-gain' });
    else lines.push({ t: '· ' + event.result, c: event.type === 'mild' ? 'l-amb' : 'l-gain' });
  }

  lines.push({
    t: '✦ 带回营地：食材×' + y.food + '　木料×' + y.wood + '　矿料×' + y.ore,
    c: 'l-gain'
  });

  return { lines: lines, yield: y, event: event ? JSON.parse(JSON.stringify(event)) : null };
}

/* ========================================================
   计时
======================================================== */
let endAt = 0;
let clockTimer = null;
let playTimer  = null;
let script = null;
let lineIdx = 0;

function startFocus(){
  S.phase = 'focus';
  syncTimes();
  renderVillage();
  updateButton();
  phaseEl.textContent = '探索中';

  pushLog('', '');
  pushLog('· 你提起灯，往里走了。', 'l-amb');

  script  = buildScript();
  lineIdx = 0;

  const stepMs = (S.focusMs * 0.9) / script.lines.length;

  clearInterval(playTimer);
  playTimer = setInterval(() => {
    if (lineIdx >= script.lines.length) {
      clearInterval(playTimer);
      playTimer = null;
      return;
    }
    const it = script.lines[lineIdx++];
    pushLog(it.t, it.c);
    save();
  }, stepMs);

  endAt = Date.now() + S.focusMs;
  save();
  clearInterval(clockTimer);
  clockTimer = setInterval(tick, 250);
  tick();
}

function tick(){
  if (S.phase !== 'focus' && S.phase !== 'rest') return;
  const left = Math.max(0, endAt - Date.now());
  clockEl.textContent = fmtClock(left);
  if (left <= 0) {
    clearInterval(clockTimer);
    clockTimer = null;
    if (S.phase === 'focus') onFocusEnd();
    else if (S.phase === 'rest') onRestEnd();
  }
}

function onFocusEnd(){
  // 状态先切换，避免计时器重复触发造成重复结算。
  if (S.phase !== 'focus') return;
  clearInterval(playTimer);
  playTimer = null;
  if (script && script.event && Array.isArray(script.event.choices) && !script.event.choiceResolved) {
    S.phase='choice'; S.pendingChoice={eventId:script.event.id}; endAt=0;
    phaseEl.textContent='发现了值得停下的事';
    pushLog('✧ '+script.event.title+'：你们需要决定接下来怎么做。','l-title');
    showChoiceModal(); save(); return;
  }

  if (script) {
    while (lineIdx < script.lines.length) {
      const it = script.lines[lineIdx++];
      pushLog(it.t, it.c);
    }
    const y = script.yield;
    S.exploredRegions[S.region] = (S.exploredRegions[S.region] || 0) + 1;
    S.totalExplorations += 1;
    S.totalFocusMs += S.focusMs;
    S.mat.food += Math.max(0, Number(y.food) || 0);
    S.mat.wood += Math.max(0, Number(y.wood) || 0);
    S.mat.ore  += Math.max(0, Number(y.ore) || 0);
    const eventText = script.event ? ('遭遇：' + script.event.title + '。') : '这次没有遇到特别事件。';
    addChronicle('explore', '完成了一次探索', eventText + '带回食材×' + y.food + '、木料×' + y.wood + '、矿料×' + y.ore + '。');
    if (script.event) addChronicle('event', '遭遇事件：' + script.event.title, eventText + (script.event.choiceResult ? '选择：'+script.event.choiceLabel+'。'+script.event.choiceResult : ''));
    if (script.event && script.event.choiceResult) { pushLog('· 你们选择了：'+script.event.choiceLabel+'。'+script.event.choiceResult,'l-gain'); if(script.event.choiceItem && !S.hiddenItems.includes(script.event.choiceItem)) S.hiddenItems.push(script.event.choiceItem); }
    updateRelationships('explore');
    triggerPairEvent('explore');
    checkResidentUnlocks();
    if(script.event && script.event.choiceResolved) triggerRegionalResidentDialogue();
    triggerResidentStories();
  }

  S.phase = 'rest';
  const restMs = Math.max(30 * 1000, Math.floor(S.focusMs / 5));
  endAt = Date.now() + restMs;
  pushLog('✦ 这一轮探索结束了。回营地歇口气吧。', 'l-win');
  renderAll();
  save();
  phaseEl.textContent = '营地 · 休整中';
  save();
  clearInterval(clockTimer);
  clockTimer = setInterval(tick, 250);
  tick();
}

function onRestEnd(){
  // 休整结束后切回 idle；后续 tick 不会再重复追加日志。
  if (S.phase !== 'rest') return;
  clearInterval(clockTimer);
  clockTimer = null;
  S.phase = 'idle';
  endAt = 0;
  triggerPairEvent('night');
  clockEl.textContent = '00:00';
  phaseEl.textContent = '随时出发';
  pushLog('· 火快灭了。该动了。', 'l-amb');
  renderAll();
  save();
}

function restoreRuntime(){
  if (S.phase === 'choice') { phaseEl.textContent='发现了值得停下的事'; showChoiceModal(); return; }
  if (S.phase !== 'focus' && S.phase !== 'rest') {
    S.phase = 'idle';
    endAt = 0;
    return;
  }
  if (S.phase === 'focus') {
    phaseEl.textContent = '探索中 · 已恢复';
    pushLog('· 你提起灯，继续这次尚未结束的探索。', 'l-amb');
    if (script) {
      for (let i = 0; i < lineIdx; i++) {
        const previous = script.lines[i];
        pushLog(previous.t, previous.c);
      }
    }
    const remaining = Math.max(0, endAt - Date.now());
    const leftLines = script ? script.lines.length - lineIdx : 0;
    if (leftLines > 0 && remaining > 0) {
      const stepMs = Math.max(250, (remaining * 0.9) / leftLines);
      playTimer = setInterval(() => {
        if (S.phase !== 'focus' || !script || lineIdx >= script.lines.length) {
          clearInterval(playTimer);
          playTimer = null;
          return;
        }
        const it = script.lines[lineIdx++];
        pushLog(it.t, it.c);
        save();
      }, stepMs);
    }
  } else {
    phaseEl.textContent = '营地 · 休整中 · 已恢复';
  }
  clockTimer = setInterval(tick, 250);
  tick();
  renderAll();
  syncTimes();
}

/* 从后台切回来时立刻补结算 */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) save();
  else if (clockTimer) tick();
});
window.addEventListener('beforeunload', save);

/* ========================================================
   交互
======================================================== */
btn.onclick = () => {
  if (S.phase === 'focus') return;

  const done = S.built.every(Boolean);
  const last = S.region >= REGIONS.length - 1;

  if (done && !last) { nextRegion(); return; }
  if (done && last)  { return; }

  startFocus();
};

document.querySelectorAll('#times button').forEach(b => {
  b.onclick = () => {
    if (S.phase === 'focus' || S.phase === 'choice') return;
    S.focusMs = Number(b.dataset.min) * 60000;
    save();
    syncTimes();
    if (S.phase !== 'rest') clockEl.textContent = fmtClock(S.focusMs);
  };
});

/* ---------- 页面切换与日志高度 ---------- */
function switchPage(page){
  const explore = page === 'explore';
  $('#explore-page').classList.toggle('hidden', !explore);
  $('#village-page').classList.toggle('hidden', explore);
  $('#tab-explore').classList.toggle('active', explore);
  $('#tab-village').classList.toggle('active', !explore);
  $('#tab-explore').setAttribute('aria-selected', String(explore));
  $('#tab-village').setAttribute('aria-selected', String(!explore));
}
$('#tab-explore').addEventListener('click', () => switchPage('explore'));
$('#tab-village').addEventListener('click', () => switchPage('village'));
$('#resident-open-btn').addEventListener('click', () => { renderResidents(); $('#resident-modal').classList.remove('hidden'); });
$('#resident-close').addEventListener('click', () => $('#resident-modal').classList.add('hidden'));
$('#resident-modal').addEventListener('click', e => { if (e.target === $('#resident-modal')) $('#resident-modal').classList.add('hidden'); });

const LOG_HEIGHT_KEY = 'pixel-village-log-height-v1';
const logHandle = $('#log-resize-handle');
function setLogHeight(height, persist=true){
  const page = $('#explore-page');
  const max = Math.max(160, page.clientHeight - 70);
  const min = window.matchMedia('(max-width:640px)').matches ? 110 : 180;
  const next = Math.max(min, Math.min(max, height));
  logBox.style.flex = '0 0 ' + next + 'px';
  logBox.style.height = next + 'px';
  if (persist) { try { localStorage.setItem(LOG_HEIGHT_KEY, String(next)); } catch(e) {} }
}
try {
  const savedHeight = Number(localStorage.getItem(LOG_HEIGHT_KEY));
  if (savedHeight > 0) requestAnimationFrame(() => setLogHeight(savedHeight, false));
} catch(e) {}
let resizingLog = false;
let resizeStartY = 0;
let resizeStartHeight = 0;
logHandle.addEventListener('pointerdown', e => {
  resizingLog = true; resizeStartY = e.clientY; resizeStartHeight = logBox.getBoundingClientRect().height;
  logHandle.setPointerCapture(e.pointerId); e.preventDefault();
});
logHandle.addEventListener('pointermove', e => {
  if (!resizingLog) return;
  setLogHeight(resizeStartHeight + e.clientY - resizeStartY);
});
function endLogResize(){ resizingLog = false; }
logHandle.addEventListener('pointerup', endLogResize);
logHandle.addEventListener('pointercancel', endLogResize);
logHandle.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault(); const delta = e.key === 'ArrowUp' ? -24 : 24;
    setLogHeight(logBox.getBoundingClientRect().height + delta);
  }
});
window.addEventListener('resize', () => {
  if (logBox.style.height) setLogHeight(parseFloat(logBox.style.height), false);
});

/* ---------- 存档弹层 ---------- */
const modal    = $('#modal');
const codeEl   = $('#code');
const msgEl    = $('#modal-msg');

function showMsg(t){ msgEl.textContent = t || ''; }

$('#journal-btn').onclick = () => { renderChronicle(); $('#journal-modal').classList.remove('hidden'); };
$('#journal-close').onclick = () => $('#journal-modal').classList.add('hidden');
$('#journal-modal').addEventListener('click', e => { if (e.target === $('#journal-modal')) $('#journal-modal').classList.add('hidden'); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const residents = $('#resident-modal');
  const journal = $('#journal-modal');
  if (!$('#event-choice-modal').classList.contains('hidden')) return;
  if (!residents.classList.contains('hidden')) residents.classList.add('hidden');
  else if (!journal.classList.contains('hidden')) journal.classList.add('hidden');
  else if (!modal.classList.contains('hidden')) modal.classList.add('hidden');
});

$('#save-btn').onclick = () => {
  if (S.phase === 'focus' || S.phase === 'choice') {
    pushLog('· 现在还在处理探索中的事情。', 'l-amb');
    return;
  }
  showMsg('');
  codeEl.value = '';
  modal.classList.remove('hidden');
};
$('#do-close').onclick = () => modal.classList.add('hidden');
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.add('hidden'); });

$('#do-export').onclick = async () => {
  const code = exportCode();
  codeEl.value = code;
  try {
    await navigator.clipboard.writeText(code);
    showMsg('已复制到剪贴板。');
  } catch (e) {
    codeEl.focus();
    codeEl.setSelectionRange(0, code.length);
    showMsg('请长按上面文本框，全选后复制。');
  }
};

$('#do-import').onclick = () => {
  if (S.phase === 'focus') { showMsg('探索进行中，暂时不能导入存档。'); return; }
  try {
    const d = importCode(codeEl.value);
    // 先验证存档；验证失败时不碰当前计时器和进度。
    if (!d || typeof d !== 'object' || Array.isArray(d) || !Number.isInteger(d.region) ||
        d.region < 0 || d.region >= REGIONS.length || !d.mat || typeof d.mat !== 'object' ||
        !Array.isArray(d.built) || d.built.length < 4 ||
        !['food','wood','ore'].every(k => Number.isFinite(Number(d.mat[k])) && Number(d.mat[k]) >= 0)) {
      throw new Error('bad');
    }
    clearInterval(clockTimer); clearInterval(playTimer); clockTimer = null; playTimer = null;
    if (!applySnapshot(d)) throw new Error('bad');
    save();
    renderAll();
    clockEl.textContent = fmtClock(S.focusMs);
    phaseEl.textContent = '准备出发';
    restoreRuntime();
    showMsg('导入成功。');
    pushLog('▸ 存档已载入。', 'l-title');
    renderChronicle();
  } catch (e) {
    showMsg('存档码无效，检查一下有没有复制全。');
  }
};

$('#do-reset').onclick = () => {
  // 先把旧进度码留在文本框中，用户可复制备份后再清空。
  let backup = '';
  try { backup = exportCode(); } catch (e) {}
  if (backup) codeEl.value = backup;
  if (!confirm('即将清空当前版本的游戏进度。旧进度存档码已放在上方文本框，请先复制保存。\n\n确定清空并开始新游戏吗？')) {
    showMsg('已取消清空；原进度未改变，存档码仍保留在文本框中。');
    return;
  }
  try {
    if (!storageOK) throw new Error('storage unavailable');
    localStorage.removeItem(SAVE_KEY);
    if (localStorage.getItem(SAVE_KEY) !== null) throw new Error('remove failed');
    clearInterval(clockTimer); clearInterval(playTimer);
    clockTimer = null; playTimer = null; endAt = 0; script = null; lineIdx = 0;
    // 重置所有内存状态，而不只是删除 localStorage。
    S.phase = 'idle'; S.focusMs = 25 * 60 * 1000; S.region = 0;
    S.mat = {food:0, wood:0, ore:0}; S.built = [false,false,false,false];
    S.finished = false; S.chronicle = []; S.residents = []; S.exploredRegions = [0,0,0,0]; S.builtRegions = REGIONS.map(() => [false,false,false,false]); S.totalFocusMs=0; S.totalExplorations=0; S.residentJoinAt={}; S.residentStories=[]; S.relationships={}; S.relationshipEvents=[]; S.socialEvents=[]; S.regionDiscoveries=[]; S.hiddenItems=[]; S.regionArc=0; S.pendingChoice=null;
    logBox.innerHTML = '';
    phaseEl.textContent = '准备出发'; clockEl.textContent = fmtClock(S.focusMs);
    pushLog('◆ 像素荒村', 'l-title');
    pushLog(REGIONS[0].intro, 'l-amb');
    pushLog('「那就先搭个棚子。」同行的厨师说，「剩下的慢慢来。」', 'l-amb');
    pushLog('── 每完成一次探索，带回材料，建起一处村落。──', 'l-title');
    renderAll(); syncTimes();
    showMsg('清空成功！已重置内存状态与当前版本存档。旧进度存档码仍在文本框中，请复制备份。');
  } catch (e) {
    showMsg('清空失败：无法确认本地存档已删除。请勿关闭页面，先复制上方旧进度存档码。');
  }
};

/* ========================================================
   启动
======================================================== */
const loadStatus = load();
renderAll();
clockEl.textContent = fmtClock(S.phase === 'idle' ? S.focusMs : Math.max(0, endAt - Date.now()));
restoreRuntime();

if (loadStatus === 'invalid') {
  pushLog('注意：检测到当前版本存档损坏或结构不兼容，已按新游戏状态启动；如有旧存档码，可通过存档窗口尝试导入。', 'l-title');
} else if (loadStatus === 'new') {
  pushLog('已开始新游戏。当前没有读取到旧存档。', 'l-amb');
}

if (!storageOK) {
  pushLog('◆ 像素荒村', 'l-title');
  pushLog('注意：当前环境无法保存进度（可能是无痕浏览，或本地文件方式打开）。建议用「存档」里的存档码手动备份。', 'l-title');
}

if (S.finished) {
  pushLog('◆ 像素荒村', 'l-title');
  pushLog('村子建起来了。厨师说，明天该琢磨点什么新菜。', 'l-amb');
} else if (S.region > 0 || S.built.some(Boolean)) {
  const r = REGIONS[S.region];
  pushLog('◆ 像素荒村', 'l-title');
  pushLog('你回到了' + r.name + '。火还在，活儿也还在。', 'l-amb');
} else {
  pushLog('◆ 像素荒村', 'l-title');
  pushLog(REGIONS[0].intro, 'l-amb');
  pushLog('「那就先搭个棚子。」厨师说，「剩下的慢慢来。」', 'l-amb');
  pushLog('── 每完成一次探索，带回材料，建起一处村落。──', 'l-title');
}
</script>
</body>
